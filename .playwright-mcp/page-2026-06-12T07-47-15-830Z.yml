              - generic [ref=e179]:
                - text: DNS records are foundational instructions on authoritative servers that map domain names to IP addresses and dictate how requests for a domain are handled. They are the digital phonebook of the internet, ensuring users reach your website and emails are delivered properly.
                - generic [ref=e181]:
                  - link "Cloudflare（+1 个）- 查看相关链接" [ref=e183] [cursor=pointer]:
