              - heading "Core DNS Record Types Explained" [level=3] [ref=e189]
              - list [ref=e191]:
                - listitem [ref=e192]:
                  - generic [ref=e193]:
                    - strong [ref=e194]: "A Record (Address):"
                    - text: Maps a domain name directly to an IPv4 address (e.g.,
                    - code [ref=e195]: 192.0.2.1
                    - text: ). This is the most common record used to point a domain to a website’s hosting server.
                - listitem [ref=e196]:
                  - generic [ref=e197]:
                    - strong [ref=e198]: "AAAA Record (IPv6 Address):"
                    - text: Maps a domain name to an IPv6 address. It serves the same function as an A record but utilizes the newer, expanded IPv6 addressing system.
                - listitem [ref=e199]:
                  - generic [ref=e200]:
                    - strong [ref=e201]: "CNAME Record (Canonical Name):"
                    - text: Creates an alias that points a domain or subdomain to
                    - emphasis [ref=e202]: another
                    - text: domain name (rather than directly to an IP address). For example, pointing
                    - code [ref=e203]: ://yourdomain.com
                    - text: to
                    - code [ref=e204]: yourdomain.com
                    - text: .
                - listitem [ref=e205]:
                  - generic [ref=e206]:
                    - strong [ref=e207]: "MX Record (Mail Exchange):"
                    - text: Directs email to the specific mail servers responsible for handling incoming messages for your domain. These must always point to an A or AAAA record, never to a CNAME.
                - listitem [ref=e208]:
                  - generic [ref=e209]:
                    - strong [ref=e210]: "TXT Record (Text):"
                    - text: Allows you to store arbitrary, human-readable text in the DNS. It is frequently used for domain verification, security, and anti-spam protocols like SPF, DKIM, and DMARC.
                - listitem [ref=e211]:
                  - generic [ref=e212]:
                    - strong [ref=e213]: "NS Record (Name Server):"
                    - text: Delegates a domain (or subdomain) to a specific set of authoritative DNS servers, telling the internet which servers hold the actual DNS records for that domain.
                - listitem [ref=e214]:
                  - generic [ref=e215]:
                    - strong [ref=e216]: "SOA Record (Start of Authority):"
                    - text: Contains critical administrative information about the domain, including the primary name server, the email address of the administrator, the serial number of the zone, and various refresh/retry timers.
