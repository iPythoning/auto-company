        - text: to instantly check A, MX, TXT, and all major DNS record types. Also try our
        - link "step-by-step DNS record checking guide" [ref=e77] [cursor=pointer]:
          - /url: https://ipythoning.github.io/dns-tools/how-to-check-dns-records.html
        - text: with screenshots and detailed instructions for every method.
