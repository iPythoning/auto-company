    - article [ref=e9]:
      - generic [ref=e10]:
        - paragraph [ref=e11]: DNS cache is a temporary database maintained by your operating system and browser that stores recently visited domain names and their corresponding IP addresses. While DNS caching speeds up your browsing experience, sometimes you need to clear it — especially after changing DNS records, migrating websites, or troubleshooting network issues.
        - paragraph [ref=e12]
        - paragraph [ref=e13]: Why Clear DNS Cache?When you change your domain's DNS records (like updating A records or MX records), the old entries may still be cached. This means you'll keep reaching the old server instead of the new one. Clearing your DNS cache forces your system to fetch fresh records from authoritative DNS servers.
        - paragraph [ref=e14]: "Common scenarios where you need to flush DNS:"
        - paragraph [ref=e15]: • After updating your website's hosting provider
        - paragraph [ref=e16]: • After changing email servers (MX records)
        - paragraph [ref=e17]: • When a website loads an old version after DNS changes
        - paragraph [ref=e18]: • When experiencing ERR_CONNECTION_REFUSED or DNS_PROBE_FINISHED_NXDOMAIN errors
        - paragraph [ref=e19]
        - paragraph [ref=e20]: "How to Clear DNS Cache on WindowsOpen Command Prompt as Administrator and run:"
        - generic [ref=e21]: ipconfig /flushdns
        - paragraph [ref=e22]: "You should see: \"Successfully flushed the DNS Resolver Cache.\" For a deeper reset, restart the DNS Client service:"
        - generic [ref=e23]: net stop dnscache net start dnscache
        - paragraph [ref=e24]: "How to Clear DNS Cache on macOSmacOS Ventura, Sonoma, Sequoia & later:"
        - generic [ref=e25]: sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder
        - paragraph [ref=e26]: "macOS Monterey & Big Sur: same command as above. macOS Catalina & earlier:"
        - generic [ref=e27]: sudo killall -HUP mDNSResponder
        - paragraph [ref=e28]: "How to Clear DNS Cache on LinuxMost modern Linux distributions use systemd-resolved:"
        - generic [ref=e29]: sudo systemd-resolve --flush-caches
        - paragraph [ref=e30]: "Or restart the service:"
        - generic [ref=e31]: sudo systemctl restart systemd-resolved
        - paragraph [ref=e32]: "How to Clear Browser DNS CacheBrowsers maintain their own DNS cache separate from the operating system:"
        - paragraph [ref=e33]: "Chrome: Type chrome://net-internals/#dns → click \"Clear host cache\""
        - paragraph [ref=e34]: "Firefox: Type about:networking#dns → click \"Clear DNS Cache\""
        - paragraph [ref=e35]: "Edge: Type edge://net-internals/#dns → click \"Clear host cache\""
        - paragraph [ref=e36]: "Safari: Enable Develop menu (Preferences → Advanced) → Develop → Empty Caches"
        - paragraph [ref=e37]
        - paragraph [ref=e38]: "Verify and Learn MoreAfter clearing the cache, verify changes by performing a DNS lookup. For detailed instructions with screenshots for every platform, visit the complete guide:"
